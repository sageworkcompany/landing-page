<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .wrap{padding:30px 34px;display:flex;flex-direction:column;gap:20px;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .lbl{font-family:var(--font-sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);width:74px;flex:none;}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="lbl">Filtros</span>
    <span class="og-chip og-chip--active">Anéis</span>
    <span class="og-chip">Brincos</span>
    <span class="og-chip">Colares</span>
    <span class="og-chip">Ouro 18K</span>
    <span class="og-chip">Diamante</span>
  </div>
  <div class="row"><span class="lbl">Tags</span>
    <span class="og-tag og-tag--new">Lançamento</span>
    <span class="og-tag og-tag--sale">-20% Off</span>
    <span class="og-tag og-tag--soft">Best-seller</span>
  </div>
</div></body></html>
