<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .wrap{padding:30px 34px;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;}
</style></head>
<body><div class="wrap">
  <div>
    <label class="og-label" for="a">E-mail</label>
    <input id="a" class="og-input" placeholder="voce@email.com">
  </div>
  <div>
    <label class="og-label" for="b">CEP</label>
    <input id="b" class="og-input" value="01310-100">
  </div>
  <div style="grid-column:1 / -1">
    <label class="og-label" for="c">Buscar</label>
    <input id="c" class="og-input" placeholder="Anel solitário, ref. 2841…" style="border-color:var(--gold);box-shadow:0 0 0 3px rgba(174,137,63,0.14)">
  </div>
</div></body></html>
