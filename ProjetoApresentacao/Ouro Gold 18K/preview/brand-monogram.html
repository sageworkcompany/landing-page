<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .wrap{padding:26px 32px;display:flex;align-items:center;gap:40px;}
  .mono{width:104px;height:104px;border:1px solid var(--line-strong);position:relative;display:flex;align-items:center;justify-content:center;flex:none;}
  .mono::after{content:"";position:absolute;inset:5px;border:1px solid var(--gold);}
  .mono span{font-family:var(--font-display);font-weight:500;font-size:54px;color:var(--espresso);letter-spacing:.02em;z-index:1;}
  .note .t{font-family:var(--font-display);font-size:24px;color:var(--espresso);margin:0 0 8px;}
  .note p{font-family:var(--font-sans);font-size:13.5px;color:var(--mocha);margin:0;max-width:340px;line-height:1.55;}
  .mini{display:flex;gap:14px;margin-top:14px;align-items:center;}
  .favicon{width:40px;height:40px;background:var(--espresso);display:flex;align-items:center;justify-content:center;}
  .favicon span{font-family:var(--font-display);font-size:22px;color:var(--gold-light);}
</style></head>
<body><div class="wrap">
  <div class="mono"><span>OG</span></div>
  <div class="note">
    <p class="t">Monograma OG</p>
    <p>Selo compacto para favicon, embalagem, lacre de garantia e aplicações onde o wordmark completo não cabe.</p>
    <div class="mini"><div class="favicon"><span>OG</span></div><span style="font-family:var(--font-sans);font-size:11.5px;color:var(--taupe)">favicon / app</span></div>
  </div>
</div></body></html>
