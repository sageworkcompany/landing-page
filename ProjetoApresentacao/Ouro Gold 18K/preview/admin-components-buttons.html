<!doctype html><html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../admin/admin.css">
<link rel="stylesheet" href="../admin/admin-components.css">
<style>body{background:var(--ad-surface);padding:26px 30px;display:flex;flex-direction:column;gap:18px;}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ad-ink-3);width:70px;flex:none;}</style></head>
<body>
<div class="row"><span class="lbl">Botões</span>
<button class="ad-btn ad-btn-primary">Novo produto</button>
<button class="ad-btn ad-btn-dark">Pedido manual</button>
<button class="ad-btn ad-btn-outline">Exportar</button>
<button class="ad-btn ad-btn-ghost">Cancelar</button>
<button class="ad-btn ad-btn-danger">Bloquear</button>
</div>
<div class="row"><span class="lbl">Status</span>
<span class="ad-pill ad-pill-success">Pago</span>
<span class="ad-pill ad-pill-warn">Aguardando</span>
<span class="ad-pill ad-pill-info">Em separação</span>
<span class="ad-pill ad-pill-gold">Enviado</span>
<span class="ad-pill ad-pill-error">Cancelado</span>
<span class="ad-pill ad-pill-neutral">Devolução</span>
</div>
<div class="row"><span class="lbl">Tags</span>
<span class="ad-tag">Ouro 18K</span>
<span class="ad-coupon">BEMVINDA10</span>
<span class="ad-pill ad-pill-gold ad-pill--nodot">VIP</span>
</div>
</body></html>
