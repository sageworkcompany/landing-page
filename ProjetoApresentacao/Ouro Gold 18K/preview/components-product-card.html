<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .wrap{padding:28px 32px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .pc{background:var(--paper);}
  .ph{position:relative;aspect-ratio:4/5;background:var(--champagne);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .ph .glyph{font-family:var(--font-display);font-style:italic;font-size:30px;color:var(--line-strong);}
  .ph .tag{position:absolute;top:10px;left:10px;}
  .fav{position:absolute;top:10px;right:10px;width:30px;height:30px;border:1px solid var(--line-strong);background:rgba(252,250,246,.85);display:flex;align-items:center;justify-content:center;color:var(--mocha);border-radius:var(--r-sm);}
  .info{padding:13px 2px 2px;}
  .eyb{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);}
  .nm{font-family:var(--font-display);font-size:20px;color:var(--espresso);margin:3px 0 6px;line-height:1.1;}
  .pr{display:flex;align-items:baseline;gap:8px;}
</style></head>
<body><div class="wrap">
  <div class="pc"><div class="ph"><span class="og-tag og-tag--new tag">Lançamento</span><span class="fav">♡</span><span class="glyph">anel</span></div>
    <div class="info"><div class="eyb">Ouro 18K · Diamante</div><div class="nm">Solitário Aurora</div><div class="pr"><span class="og-price">R$ 4.290</span></div></div></div>
  <div class="pc"><div class="ph"><span class="og-tag og-tag--sale tag">-20%</span><span class="fav">♡</span><span class="glyph">colar</span></div>
    <div class="info"><div class="eyb">Ouro 18K</div><div class="nm">Colar Filo</div><div class="pr"><span class="og-price">R$ 2.632</span><span class="og-price og-price-old">R$ 3.290</span></div></div></div>
  <div class="pc"><div class="ph"><span class="fav">♡</span><span class="glyph">brinco</span></div>
    <div class="info"><div class="eyb">Ouro 18K · Pérola</div><div class="nm">Brinco Maré</div><div class="pr"><span class="og-price">R$ 1.880</span></div></div></div>
</div></body></html>
