<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .wrap{padding:30px 34px;display:flex;flex-direction:column;gap:20px;}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .lbl{font-family:var(--font-sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);width:74px;flex:none;}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="lbl">Primary</span>
    <button class="og-btn og-btn--primary">Comprar agora</button>
    <button class="og-btn og-btn--gold">Adicionar ao carrinho</button>
  </div>
  <div class="row"><span class="lbl">Outline</span>
    <button class="og-btn og-btn--outline">Ver coleção</button>
    <button class="og-btn og-btn--ghost">Lista de desejos</button>
  </div>
  <div class="row"><span class="lbl">Tamanhos</span>
    <button class="og-btn og-btn--primary og-btn--sm">Pequeno</button>
    <button class="og-btn og-btn--primary">Médio</button>
    <button class="og-btn og-btn--primary og-btn--lg">Grande</button>
  </div>
</div></body></html>
