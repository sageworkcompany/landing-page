<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .wrap{padding:0;display:grid;grid-template-columns:1fr 1fr;}
  .cell{padding:34px;display:flex;align-items:center;justify-content:center;min-height:150px;}
  .dark{background:var(--espresso);}
  .lockup{text-align:center;}
  .wm{font-family:var(--font-display);font-weight:600;font-size:38px;letter-spacing:.14em;line-height:1;}
  .light .wm{color:var(--espresso);}
  .dark .wm{color:var(--on-dark);}
  .sub{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:11px;}
  .ln{height:1px;width:42px;}
  .light .ln{background:var(--line-strong);}
  .dark .ln{background:var(--mocha);}
  .fj{font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.28em;}
  .light .fj{color:var(--mocha);}
  .dark .fj{color:var(--on-dark-mut);}
  .k{font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--gold);}
  .dark .k{color:var(--gold-light);}
</style></head>
<body><div class="wrap">
  <div class="cell light">
    <div class="lockup"><div class="wm">OURO&nbsp;GOLD</div><div class="sub"><span class="ln"></span><span class="fj">FINE&nbsp;JEWELRY</span><span class="k">18K</span><span class="ln"></span></div></div>
  </div>
  <div class="cell dark">
    <div class="lockup"><div class="wm">OURO&nbsp;GOLD</div><div class="sub"><span class="ln"></span><span class="fj">FINE&nbsp;JEWELRY</span><span class="k">18K</span><span class="ln"></span></div></div>
  </div>
</div></body></html>
