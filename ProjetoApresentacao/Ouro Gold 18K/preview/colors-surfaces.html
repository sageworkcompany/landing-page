<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .wrap{padding:28px 32px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .sw{display:flex;flex-direction:column;gap:8px;}
  .chip{height:78px;border-radius:var(--r-md);border:1px solid var(--line);}
  .n{font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--espresso);}
  .h{font-family:var(--font-sans);font-size:11.5px;color:var(--taupe);letter-spacing:.02em;}
</style></head>
<body><div class="wrap"><div class="grid">
  <div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="n">Paper</div><div class="h">#FCFAF6 · fundo</div></div>
  <div class="sw"><div class="chip" style="background:var(--champagne)"></div><div class="n">Champagne</div><div class="h">#F4EEE3 · seções</div></div>
  <div class="sw"><div class="chip" style="background:var(--sand)"></div><div class="n">Sand</div><div class="h">#E9DFCF · hover</div></div>
  <div class="sw"><div class="chip" style="background:var(--gold-wash)"></div><div class="n">Gold Wash</div><div class="h">#F0E6D2 · tinte</div></div>
</div></div></body></html>
