<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .wrap{padding:28px 32px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px;}
  .sw{display:flex;flex-direction:column;gap:8px;}
  .chip{height:72px;border-radius:var(--r-md);border:1px solid var(--line);}
  .n{font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--espresso);}
  .h{font-family:var(--font-sans);font-size:11.5px;color:var(--taupe);}
  .foil{height:46px;border-radius:var(--r-md);background:var(--gold-foil);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;color:#3a2e12;font-size:18px;}
</style></head>
<body><div class="wrap">
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--gold)"></div><div class="n">Gold</div><div class="h">#AE893F · acento</div></div>
  <div class="sw"><div class="chip" style="background:var(--gold-deep)"></div><div class="n">Gold Deep</div><div class="h">#8C6C2C · hover</div></div>
  <div class="sw"><div class="chip" style="background:var(--gold-light)"></div><div class="n">Gold Light</div><div class="h">#D8C194 · em escuro</div></div>
  <div class="sw"><div class="chip" style="background:var(--gold-wash)"></div><div class="n">Gold Wash</div><div class="h">#F0E6D2 · fundo</div></div>
</div>
<div class="foil">Gold foil — uso pontual</div>
</div></body></html>
