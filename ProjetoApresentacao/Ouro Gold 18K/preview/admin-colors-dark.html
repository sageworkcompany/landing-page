<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../admin/admin.css">
<style>body{background:var(--ad-surface);padding:26px 30px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.sw{display:flex;flex-direction:column;gap:7px;}
.chip{height:64px;border-radius:8px;border:1px solid var(--ad-line);}
.n{font-size:12.5px;font-weight:700;color:var(--ad-ink);}
.h{font-size:11px;color:var(--ad-ink-3);}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ad-ink-3);margin:6px 0 12px;}</style></head>
<body>
<div class="lbl">Tema escuro — superfícies</div>
<div class="grid">
<div class="sw"><div class="chip" style="background:var(--ad-canvas)"></div><div class="n">Canvas</div><div class="h">#1A1611</div></div>
<div class="sw"><div class="chip" style="background:var(--ad-surface)"></div><div class="n">Surface</div><div class="h">#221C16</div></div>
<div class="sw"><div class="chip" style="background:var(--ad-surface-2)"></div><div class="n">Surface 2</div><div class="h">#2A231C</div></div>
<div class="sw"><div class="chip" style="background:var(--ad-sidebar)"></div><div class="n">Sidebar</div><div class="h">#15110D</div></div>
</div>
<div class="lbl" style="margin-top:20px">Tinta & ouro</div>
<div class="grid">
<div class="sw"><div class="chip" style="background:var(--ad-ink)"></div><div class="n">Ink</div><div class="h">#F1EADF</div></div>
<div class="sw"><div class="chip" style="background:var(--ad-ink-2)"></div><div class="n">Ink 2</div><div class="h">#BBAD9C</div></div>
<div class="sw"><div class="chip" style="background:var(--ad-gold)"></div><div class="n">Gold</div><div class="h">#C9A24B</div></div>
<div class="sw"><div class="chip" style="background:var(--ad-gold-wash)"></div><div class="n">Gold wash</div><div class="h">#2E2719</div></div>
</div>
</body></html>
