<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .wrap{padding:30px 34px;}
  .row{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--line);padding:14px 0;}
  .row:last-child{border-bottom:0;}
  .meta{font-family:var(--font-sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);width:120px;flex:none;}
  .spec{font-family:var(--font-display);color:var(--espresso);line-height:1;}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="meta">Display 72</span><span class="spec" style="font-size:54px;font-weight:500;">Joias que duram</span></div>
  <div class="row"><span class="meta">H1 · 44</span><span class="spec" style="font-size:40px;font-weight:500;">Coleção Aurora</span></div>
  <div class="row"><span class="meta">H2 · 34 italic</span><span class="spec" style="font-size:32px;font-weight:400;font-style:italic;">feito à mão</span></div>
  <div class="row"><span class="meta">H3 · 26</span><span class="spec" style="font-size:26px;font-weight:600;">Ouro 18 quilates</span></div>
</div></body></html>
