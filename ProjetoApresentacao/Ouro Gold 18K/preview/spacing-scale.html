<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;gap:11px;}
  .row{display:flex;align-items:center;gap:16px;}
  .bar{height:18px;background:var(--gold);border-radius:1px;}
  .n{font-family:var(--font-sans);font-size:12px;font-weight:600;color:var(--espresso);width:54px;}
  .h{font-family:var(--font-sans);font-size:11.5px;color:var(--taupe);}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="n">sp-1</span><div class="bar" style="width:4px"></div><span class="h">4px</span></div>
  <div class="row"><span class="n">sp-2</span><div class="bar" style="width:8px"></div><span class="h">8px</span></div>
  <div class="row"><span class="n">sp-3</span><div class="bar" style="width:12px"></div><span class="h">12px</span></div>
  <div class="row"><span class="n">sp-4</span><div class="bar" style="width:16px"></div><span class="h">16px</span></div>
  <div class="row"><span class="n">sp-5</span><div class="bar" style="width:24px"></div><span class="h">24px</span></div>
  <div class="row"><span class="n">sp-6</span><div class="bar" style="width:32px"></div><span class="h">32px</span></div>
  <div class="row"><span class="n">sp-7</span><div class="bar" style="width:48px"></div><span class="h">48px</span></div>
  <div class="row"><span class="n">sp-8</span><div class="bar" style="width:64px"></div><span class="h">64px</span></div>
  <div class="row"><span class="n">sp-9</span><div class="bar" style="width:96px"></div><span class="h">96px · seções</span></div>
</div></body></html>
